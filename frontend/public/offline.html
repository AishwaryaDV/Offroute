<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Offroute</title>
    <meta name="theme-color" content="#0b1120" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: #0b1120;
        color: #fff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark { display: flex; align-items: center; gap: 8px; opacity: 0.9; }
      .mark svg { width: 24px; height: 24px; }
      .mark span { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      h1 { font-size: 18px; font-weight: 700; margin: 10px 0 0; }
      p { max-width: 20rem; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,0.45); margin: 0; }
      button {
        margin-top: 10px;
        border: 0;
        border-radius: 9999px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #0f1d32;
        background: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
      </svg>
      <span>Offroute</span>
    </div>
    <h1>You're offline</h1>
    <p>This trail needs a connection. Reconnect and we'll pick up right where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
